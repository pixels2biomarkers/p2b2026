  bio: "Hanwen Xu is the lead author of GigaPath (Prov-GigaPath, Nature 2024), the whole-slide pathology foundation model that has been downloaded more than two million times and deployed in clinical digital pathology. His research at the University of Washington builds gigascale multimodal foundation models for precision medicine across pathology, radiology, and clinical records, including GigaTIME (Cell, 2025), LLaVA-Rad, and BiomedCLIP."
