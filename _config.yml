# =============================================================================
# Site configuration — IEEE BigData 2026 Workshop
# "1st Workshop on Big Data for Computational Pathology and Multi-Omics: From Pixels to Biomarkers"
#
# Most routine updates only need the files in `_data/` (dates, speakers,
# organizers, committee) and the prose in `index.html`. The values below are the
# site-wide settings that appear in the header, footer, and page metadata.
# =============================================================================

title: "1st Workshop on Big Data for Computational Pathology and Multi-Omics"
tagline: "From Pixels to Biomarkers"
description: "The 1st Workshop on Big Data for Computational Pathology and Multi-Omics: From Pixels to Biomarkers, held with IEEE BigData 2026, December 14–17, 2026, Phoenix, AZ, USA."
# Project site: https://pixels2biomarkers.github.io/p2b2026/
# (`url` is the account's Pages host, `baseurl` the repository name with a leading slash)
url: "https://pixels2biomarkers.github.io"
baseurl: "/p2b2026"
lang: en-US

# --- Event details (shown in the header, About section, and footer) ---------
event:
  short_name: "Pixels to Biomarkers"
  # The header title is typeset as "1st" + two lines (kept to two lines on desktop)
  edition: "1st"
  edition_html: "1<sup>st</sup>"
  title_lines:
    - "Workshop on Big Data for"
    - "Computational Pathology and Multi-Omics"
  conference: "IEEE BigData 2026"
  conference_full: "2026 IEEE International Conference on Big Data"
  conference_url: "https://bigdataieee.org/BigData2026/"
  dates: "December 14–17, 2026"
  day_note: "Exact workshop day to be announced"
  city: "Phoenix, AZ, USA"
  venue: "Sheraton Phoenix Downtown"

# --- Header animation --------------------------------------------------------
# "live" : the tissue is drawn live on a canvas (assets/js/hero-tissue.js) — nuclei
#          glide along a slow flow field, glands rotate and breathe (default)
# "none" : the static tissue image only
hero_animation: "live"

# --- Submission -------------------------------------------------------------
# TODO: replace with the workshop-specific Cyberchair link once the conference
# assigns it (it will look like .../scripts/submit.php?subarea=S##).
submission_url: "https://wi-lab.com/cyberchair/2026/bigdata26/"
submission_system: "Cyberchair"
paper_format_url: "https://www.ieee.org/conferences/publishing/templates.html"
deadline_note: "All deadlines are 11:59 PM Anywhere on Earth (AoE)."

# --- Contact ----------------------------------------------------------------
# Workshop mailbox shown in the Contact section (leave empty to show a
# "coming soon" note instead).
contact_email: "pixelsbiomarkers@gmail.com"

# --- Theme & plugins (all supported natively by GitHub Pages) ---------------
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Files that should not be published
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - vendor
  - node_modules
  - .ruby-version
